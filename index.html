<style>
*{margin:0;padding:0;box-sizing:border-box}

body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:
    radial-gradient(130% 90% at 50% -12%, rgba(203,169,79,.06), transparent 55%),

/* ── stat box como ficha ── */
.sb{background:linear-gradient(165deg,#271f15,#191309);border:1px solid var(--goldDim);border-radius:7px;padding:9px 6px;text-align:center;min-width:70px;flex:1;box-shadow:inset 0 1px 0 rgba(240,217,138,.08),var(--shadow);position:relative}

textarea{width:100%;background:var(--bgInput);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--fn);font-size:14px;padding:12px;resize:vertical;outline:none;line-height:1.6;box-sizing:border-box}
.col-h{font-size:10px;color:var(--textDim);font-family:var(--fd);letter-spacing:1px;text-align:center}
.atk-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(165deg,#241d14,#1a140d);border:1px solid var(--border);border-radius:6px;margin-bottom:6px;flex-wrap:wrap;box-shadow:var(--shadow)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
const ATTRIBUTES=[{key:"FUE",label:"Fuerza"},{key:"AGI",label:"Agilidad"},{key:"CON",label:"Constitución"},{key:"INT",label:"Inteligencia"},{key:"VOL",label:"Voluntad"},{key:"CM",label:"Combate Mele"},{key:"CD",label:"Combate Distancia"}];
const SKILLS=[{name:"Acrobacias",attr:"AGI"},{name:"Actuación",attr:"VOL"},{name:"Arcana",attr:"INT"},{name:"Atletismo",attr:"FUE"},{name:"Engaño",attr:"VOL"},{name:"Forzar Cerraduras",attr:"AGI"},{name:"Historia",attr:"INT"},{name:"Intimidación",attr:"VOL"},{name:"Investigación",attr:"INT"},{name:"Juego de Manos",attr:"AGI"},{name:"Manejo de Animales",attr:"INT"},{name:"Medicina",attr:"INT"},{name:"Naturaleza",attr:"INT"},{name:"Percepción",attr:"INT"},{name:"Perspicacia",attr:"VOL"},{name:"Persuasión",attr:"VOL"},{name:"Religión",attr:"INT"},{name:"Reparación",attr:"INT"},{name:"Sigilo",attr:"AGI"},{name:"Supervivencia",attr:"INT"}];
const AFFLICTIONS=["Congelado","Envenenado","Helamiento","Ignición","Quemadura","Sangrado","Sangrado Profundo"];
const STATUS_EFFECTS=["Agarrado","Amarrado","Asustado","Aturdido","Cegado","Derribado","Dormido","Encantado","Inmovilizado","Invisible","Mudo","Oculto","Paralizado","Petrificado","Provocado","Sordo"];
const RESISTANCES=["Fuego","Hielo","Eléctrico","Arcano","Sombra","Radiante","Astral","Veneno","Ácido"];
const DOTES_LEVELS=["Defecto","Nivel 4","Nivel 8","Nivel 12","Nivel 16","Nivel 20"];
const TABS=[{key:"general",label:"General",icon:"persona"},{key:"combate",label:"Combate",icon:"escudo"},{key:"habilidades",label:"Habilid.",icon:"libro"},{key:"equipo",label:"Equipo",icon:"bolsa"},{key:"tecnicas",label:"Técnicas",icon:"destello"},{key:"estado",label:"Estado",icon:"craneo"},{key:"iniciativa",label:"Iniciativa",icon:"rayo"},{key:"notas",label:"Notas",icon:"pluma"}];
const rd=n=>Math.round(n);
const AGE_DATA={Joven:{atr:260,pn1:17,pnPer:7},Adulto:{atr:310,pn1:15,pnPer:5},Anciano:{atr:310,pn1:15,pnPer:5}};
const clampNiv=n=>Math.max(1,Math.min(20,parseInt(n)||1));
function atrExtra(niv){let e=0;for(let L=2;L<=niv;L++)e+=(L%2===0?10:5);return e}
function atrBudget(edad,niv){const d=AGE_DATA[edad]||AGE_DATA.Adulto;niv=clampNiv(niv);return d.atr+atrExtra(niv)}
function pnSugerido(edad,niv){const d=AGE_DATA[edad]||AGE_DATA.Adulto;niv=clampNiv(niv);return d.pn1+d.pnPer*(niv-1)}
const COMP_LEVELS=[{key:"sinPracticar",label:"Sin practicar",defaultVal:10},{key:"practicado",label:"Practicado",defaultVal:0},{key:"entrenado",label:"Entrenado",defaultVal:-10},{key:"experto",label:"Experto",defaultVal:-20}];
const COMP_DEFAULTS=Object.fromEntries(COMP_LEVELS.map(c=>[c.key,c.defaultVal]));
const WEAPON_SLOTS=[{key:"manoDerecha",label:"Mano Derecha"},{key:"manoIzquierda",label:"Mano Izquierda"},{key:"armaSecundaria",label:"Arma Secundaria"}];
const PREPARED_SLOTS=[{key:"preparadoArmaPrincipal",label:"Arma Principal Prep."}];
const ALL_WEAPON_SLOTS=[...WEAPON_SLOTS,...PREPARED_SLOTS];
const SHIELD_OPTIONS=["No","Ligero","Pesado"];

let _uid=0;function uid(){return Date.now().toString(36)+"_"+(++_uid)}

function emptyChar(){return{id:uid(),nombre:"",especie:"",clase:"",trasfondo:"",defectos:"",nivel:1,edad:"Adulto",experiencia:0,tamano:"",velocidad:"",pRaciales:"",attrs:{FUE:10,AGI:10,CON:10,INT:10,VOL:10,CM:10,CD:10},attrsActual:{FUE:10,AGI:10,CON:10,INT:10,VOL:10,CM:10,CD:10},stats:{pvGast:0,amGast:0,paGast:0,recursoGast:0,estresActual:0,recSecActual:0},
mods:{pvMod:0,amMod:0,iniMod:0,pCritMod:0,dCritMod:0,percPasMod:0,invPasMod:0,perspPasMod:0,bCMMod:0,bCDMod:0,aLigMod:0,aMedMod:0,aPesMod:0},
atkMods:{manoDerecha:0,manoIzquierda:0,armaSecundaria:0,preparadoArmaPrincipal:0,preparadoArmaSecundaria:0},
skills:Object.fromEntries(SKILLS.map(s=>[s.name,{nivel:"sinPracticar",valor:10}])),
competencias:Array.from({length:20},()=>({nombre:"",valor:""})),
equipo:{armaduraPrincipal:"",faldon:"",casco:"",guantes:"",botas:"",capa:"",anillo1:"",anillo2:"",manoDerecha:"",manoIzquierda:"",armaSecundaria:"",preparadoArmaPrincipal:"",preparadoArmaSecundaria:""},
armasComp:{manoDerecha:{nivel:"sinPracticar",valor:10},manoIzquierda:{nivel:"sinPracticar",valor:10},armaSecundaria:{nivel:"sinPracticar",valor:10},preparadoArmaPrincipal:{nivel:"sinPracticar",valor:10},preparadoArmaSecundaria:{nivel:"sinPracticar",valor:10}},
atkMode:{manoDerecha:"mele",manoIzquierda:"mele",armaSecundaria:"mele",preparadoArmaPrincipal:"mele",preparadoArmaSecundaria:"mele"},
escudo:"No",
mochila:"",dotes:Object.fromEntries(DOTES_LEVELS.map(l=>[l,""])),tecnicas:Array.from({length:60},()=>({nombre:"",pn:"",recurso:"",notas:""})),pnTotales:0,pnExtras:0,atrExtras:0,raza:"",subclase:"",especializacion:"",escuelaPrincipal:"",descuentoHechizos:false,mcClase:"",mcNivel:0,trasfondoEleccion:"",eleccionAtr:[],trasfondoAtrLibre:"",defectos2:"",compOverride:{},elegidas:[],mejoras:Array.from({length:20},()=>({nombre:"",duracion:"",notas:""})),aflicciones:Object.fromEntries(AFFLICTIONS.map(a=>[a,{cantidad:"",duracion:"",restante:""}])),estadosAlterados:Object.fromEntries(STATUS_EFFECTS.map(s=>[s,{cantidad:"",duracion:"",restante:""}])),resistencias:Object.fromEntries(RESISTANCES.map(r=>[r,""])),caUd:"",temple:"",notas:"",initTracker:{criaturas:[],ronda:1}}}

let characters=[],activeCharId=null,currentTab="general",showManager=false;
let newCri={nombre:"",iniciativa:"",pvTotal:"",paTotal:""};
let iniPending={};
let tecExtra=3,tecOpen={},respMin=30,reposoSeguro=false,_scrollTopNext=false;
let DATOS=null,datosErr=null,verTodo={tec:false,hec:false},pickOpen={};
const NIVC=["Sin Practicar","Practicado","Entrenado","Experto"];
const ixC=n=>Math.max(0,NIVC.indexOf(n));
const NIV2KEY={"Sin Practicar":"sinPracticar","Practicado":"practicado","Entrenado":"entrenado","Experto":"experto"};

/* Apilamiento: manda el otorgamiento más alto; cada adicional sube 1; tope Experto; nunca baja. */
function apilar(otorgs){
  if(!otorgs.length)return NIVC[0];
  const base=Math.max(...otorgs.map(o=>ixC(o.nivel)));
  return NIVC[Math.max(base,Math.min(base+otorgs.length-1,ixC("Experto")))];
}
/* Multiclase: todo llega Practicado; nv3 restaura Entrenado; nv5 restaura Experto. Nunca sobre el original. */
function mcNivel(orig,nivelEnClase){
  if(!nivelEnClase||nivelEnClase<1)return null;
  const permitido = nivelEnClase>=5?ixC("Experto") : nivelEnClase>=3?ixC("Entrenado") : ixC("Practicado");
  return NIVC[Math.min(ixC(orig),permitido)];
}
const dGet=(cat,nom)=>!DATOS||!nom?null:(DATOS[cat]||[]).find(x=>x.nombre===nom)||null;

/* Reúne TODOS los otorgamientos de competencia del personaje, con su fuente. */
function otorgamientos(ch){
  const out=[],add=(hab,nivel,fuente)=>{if(hab&&nivel)out.push({habilidad:hab,nivel,fuente});};
  const esp=dGet("especies",ch.especie), raz=dGet("razas",ch.raza),
        cla=dGet("clases",ch.clase),     tra=dGet("trasfondos",ch.trasfondo);
  (esp?.competencias||[]).forEach(c=>add(c.nombre,c.nivel,"Especie"));
  (raz?.competencias||[]).forEach(c=>add(c.nombre,c.nivel,"Raza"));
  (cla?.competencias||[]).forEach(c=>add(c.habilidad,c.nivel,"Clase"));
  (tra?.competencias||[]).forEach(c=>add(c.habilidad,c.nivel,"Trasfondo"));
  const mc=dGet("clases",ch.mcClase), mcn=parseInt(ch.mcNivel)||0;
  if(mc&&mcn>0)(mc.competencias||[]).forEach(c=>{
    const n=mcNivel(c.nivel,mcn); if(n)add(c.habilidad,n,"Multiclase");
  });
  return out;
}
/* Competencia efectiva por habilidad + de dónde viene (para el tooltip). */
function compsEfectivas(ch){
  const m={};
  otorgamientos(ch).forEach(o=>{(m[o.habilidad]=m[o.habilidad]||[]).push(o)});
  const r={};
  for(const hab in m) r[hab]={nivel:apilar(m[hab]),fuentes:m[hab]};
  return r;
}
/* Bonos de atributo automáticos (especie + raza + clase + trasfondo + multiclase + penalizaciones). */
function bonosAuto(ch){
  const t={},sum=(o,f)=>{for(const k in(o||{}))t[k]=(t[k]||0)+o[k]};
  sum(dGet("especies",ch.especie)?.bonosAtributo);
  sum(dGet("especies",ch.especie)?.penalizacionAtributo);
  sum(dGet("razas",ch.raza)?.bonosAtributo);
  sum(dGet("clases",ch.clase)?.bonosAtributo);
  sum(dGet("trasfondos",ch.trasfondo)?.bonosAtributo);
  if(ch.mcClase)sum(dGet("clases",ch.mcClase)?.bonosAtributo);
  const el=dGet("especies",ch.especie)?.bonosALibreEleccion;
  if(el)(ch.eleccionAtr||[]).slice(0,el.cantidad).forEach(a=>{if(a)t[a]=(t[a]||0)+el.valor});
  const tl=dGet("trasfondos",ch.trasfondo)?.bonosALibreEleccion;
  if(tl&&ch.trasfondoAtrLibre)t[ch.trasfondoAtrLibre]=(t[ch.trasfondoAtrLibre]||0)+tl.valor;
  if(ch.trasfondoEleccion){const tr=dGet("trasfondos",ch.trasfondo);
    (tr?.eleccionAtributo||[]).filter(x=>x.atributo===ch.trasfondoEleccion)
      .forEach(x=>t[x.atributo]=(t[x.atributo]||0)+x.valor);}
  return t;
}
const ATRKEYS=["FUE","AGI","CON","INT","VOL","CM","CD"];
/* Solo los 7 atributos cuentan para el presupuesto; AM (Afinidad Mágica) va aparte. */
const totalBonos=ch=>ATRKEYS.reduce((s,k)=>s+(bonosAuto(ch)[k]||0),0);
const bonoAM=ch=>bonosAuto(ch).AM||0;

/* Descuento de PN: técnica de especialización que abarata hechizos de tu escuela principal. */
/* Todas las escuelas a las que el personaje tiene acceso, con su origen. */
function escuelasAcceso(ch){
  if(!DATOS)return [];
  const out=[],add=(e,f)=>{if(e&&!out.some(x=>x.escuela===e))out.push({escuela:e,fuente:f})};
  const base=DATOS.escuelaBase?.[ch.clase];
  if(base&&base!=="__disciplina__")add(base,"Clase");
  if(ch.subclase)add(DATOS.escuelaSubclase?.[ch.clase+"|"+ch.subclase],"Subclase");
  if(ch.especializacion)(DATOS.accesoExtra?.[ch.clase+"|"+ch.especializacion]||[]).forEach(e=>add(e,ch.especializacion));
  if(ch.subclase)(DATOS.accesoExtra?.[ch.clase+"|"+ch.subclase]||[]).forEach(e=>add(e,ch.subclase));
  // técnicas elegidas que otorgan acceso (p.ej. Hechicero Innato)
  (ch.elegidas||[]).forEach(id=>(DATOS.accesoTecnica?.[id]||[]).forEach(e=>add(e,id.split("|")[1])));
  // Mago: sus disciplinas definen principal/secundaria/complementaria
  const cla=dGet("clases",ch.clase),mg=cla?.especializacion?.magias?.[ch.especializacion];
  if(mg){
    (escuelasPrincipales(ch)).forEach(e=>add(e,"Principal"));
    (mg.Secundaria?.escuelas||[]).forEach(e=>add(e,"Secundaria"));
    (mg.Complementaria?.escuelas||[]).forEach(e=>add(e,"Complementaria"));
  }
  return out;
}
function escuelasPrincipales(ch){
  const cla=dGet("clases",ch.clase),e=cla?.especializacion;
  if(!e||!e.magias||!ch.especializacion)return [];
  const mg=e.magias[ch.especializacion]; if(!mg?.Principal)return [];
  const l=mg.Principal.escuelas||[];
  return mg.Principal.eligeUna ? (ch.escuelaPrincipal?[ch.escuelaPrincipal]:[]) : l;
}
const TIERKEY=t=>t.startsWith("Bás")?"B":t.startsWith("Avan")?"A":"M";
/* Descuentos activos = los que otorgan las técnicas que el personaje ya eligió. */
function descuentosActivos(ch){
  if(!DATOS?.descuentosPN)return [];
  return (ch.elegidas||[]).map(id=>DATOS.descuentosPN[id]).filter(Boolean);
}
function pnDe(ch,ent){
  let pn=ent.pn||0;
  if(ent.tipo!=="hechizo"||!ent.escuela)return pn;
  let mejor=0;
  descuentosActivos(ch).forEach(d=>{
    if(d.escuelas.length&&!d.escuelas.includes(ent.escuela))return;
    if(d.tiers.length&&!d.tiers.includes(TIERKEY(ent.tier)))return;
    if(d.monto>mejor)mejor=d.monto;
  });
  return Math.max(1,pn-mejor);
}
async function cargarDatos(){
  try{const r=await fetch("datos.json",{cache:"no-cache"});if(!r.ok)throw 0;DATOS=await r.json();}
  catch(e){datosErr=true;}
  render();
}

function gc(){
  const ch=characters.find(c=>c.id===activeCharId)||emptyChar();
  // Migration
  if(ch.skills){const first=Object.values(ch.skills)[0];if(typeof first!=="object"||first===null||!first.hasOwnProperty("nivel")){ch.skills=Object.fromEntries(SKILLS.map(s=>[s.name,{nivel:"sinPracticar",valor:typeof ch.skills[s.name]==="number"?ch.skills[s.name]:10}]))}}
  if(!ch.armasComp)ch.armasComp={manoDerecha:{nivel:"sinPracticar",valor:10},manoIzquierda:{nivel:"sinPracticar",valor:10},armaSecundaria:{nivel:"sinPracticar",valor:10},preparadoArmaPrincipal:{nivel:"sinPracticar",valor:10},preparadoArmaSecundaria:{nivel:"sinPracticar",valor:10}};
  if(!ch.atkMode)ch.atkMode={manoDerecha:"mele",manoIzquierda:"mele",armaSecundaria:"mele",preparadoArmaPrincipal:"mele",preparadoArmaSecundaria:"mele"};
  if(!ch.escudo)ch.escudo="No";
  if(!ch.edad)ch.edad="Adulto";
  if(ch.atrExtras===undefined)ch.atrExtras=0;
  if(ch.raza===undefined)ch.raza="";
  if(ch.subclase===undefined)ch.subclase="";
  if(ch.especializacion===undefined)ch.especializacion="";
  if(ch.escuelaPrincipal===undefined)ch.escuelaPrincipal="";
  if(ch.descuentoHechizos===undefined)ch.descuentoHechizos=false;
  if(ch.mcClase===undefined)ch.mcClase="";
  if(ch.mcNivel===undefined)ch.mcNivel=0;
  if(ch.trasfondoEleccion===undefined)ch.trasfondoEleccion="";
  if(!ch.compOverride)ch.compOverride={};
  if(!Array.isArray(ch.elegidas))ch.elegidas=[];
  if(!Array.isArray(ch.eleccionAtr))ch.eleccionAtr=[];
  if(ch.trasfondoAtrLibre===undefined)ch.trasfondoAtrLibre="";
  if(ch.defectos2===undefined)ch.defectos2="";
  if(ch.pnExtras===undefined)ch.pnExtras=0;
  if(ch.stats&&ch.stats.recSecActual===undefined)ch.stats.recSecActual=0;
  if(!ch.mods)ch.mods={pvMod:0,amMod:0,iniMod:0,pCritMod:0,dCritMod:0,percPasMod:0,invPasMod:0,perspPasMod:0,bCMMod:0,bCDMod:0,aLigMod:0,aMedMod:0,aPesMod:0};
  if(!ch.mods.bCMMod&&ch.mods.bCMMod!==0)ch.mods.bCMMod=0;
  if(!ch.mods.bCDMod&&ch.mods.bCDMod!==0)ch.mods.bCDMod=0;
  if(!ch.mods.aLigMod&&ch.mods.aLigMod!==0)ch.mods.aLigMod=0;
  if(!ch.mods.aMedMod&&ch.mods.aMedMod!==0)ch.mods.aMedMod=0;
  if(!ch.mods.aPesMod&&ch.mods.aPesMod!==0)ch.mods.aPesMod=0;
  if(!ch.atkMods)ch.atkMods={manoDerecha:0,manoIzquierda:0,armaSecundaria:0,preparadoArmaPrincipal:0,preparadoArmaSecundaria:0};
  // Expand tecnicas/competencias if old save
  while(ch.tecnicas&&ch.tecnicas.length<60)ch.tecnicas.push({nombre:"",pn:"",recurso:"",notas:""});
  while(ch.competencias&&ch.competencias.length<20)ch.competencias.push({nombre:"",valor:""});
  return ch;
}

function mi(getter,setter,opts={}){
  const el=document.createElement("input");el.type=opts.type||"text";el.className=opts.shrink?"inp-shrink":"inp";
  el.value=getter()??"";if(opts.placeholder)el.placeholder=opts.placeholder;
  if(opts.style)Object.assign(el.style,opts.style);
  if(opts.shrink){
    el.addEventListener("input",function(){this.style.fontSize=this.value.length>20?"11px":this.value.length>14?"12px":"14px";setter(this.value);save();refreshLive()});
    el.style.fontSize=((el.value||"").length>20?"11px":(el.value||"").length>14?"12px":"14px");
  } else {
    el.addEventListener("input",()=>{setter(el.value);save();refreshLive()});
  }
  return el;
}
function msel(getter,setter,options,opts={}){
  const el=document.createElement("select");el.className="sel";
  if(opts.style)Object.assign(el.style,opts.style);
  options.forEach(o=>{const opt=document.createElement("option");opt.value=typeof o==="object"?o.value:o;opt.textContent=typeof o==="object"?o.label:o;el.appendChild(opt)});
  el.value=getter();
  el.addEventListener("change",()=>{setter(el.value);save();refreshLive()});
  return el;
}
function mta(getter,setter,opts={}){
  const el=document.createElement("textarea");el.value=getter()??"";
  if(opts.rows)el.rows=opts.rows;if(opts.placeholder)el.placeholder=opts.placeholder;
  if(opts.style)Object.assign(el.style,opts.style);
  el.addEventListener("input",()=>{setter(el.value);save();refreshLive()});

}

function getSkillVal(ch,name){const sk=ch.skills?.[name];return typeof sk==="object"?parseInt(sk.valor)||0:parseInt(sk)||0}

function calc(){
  /* Todo lo derivado se calcula con Actual: es el campo que el jugador edita
     y donde entran los buffs y debuffs de la partida. */
  const ch=gc(),a=ch.attrsActual,ab=ch.attrs,niv=parseInt(ch.nivel)||1,m=ch.mods||{};
  const pvBase=(niv*5)+(a.CON||0),pv=pvBase+(parseInt(m.pvMod)||0);
  const afMagBase=(a.INT||0)+(DATOS?bonoAM(ch):0),afMag=afMagBase+(parseInt(m.amMod)||0);
  const paMax=Math.max(5,Math.min(10,rd((a.CON||0)/10)));
  const rec=a.VOL||0;
  /* Recurso secundario de clase (Zanshin, Sellos, Aperturas): contador aparte
     que se acumula, no se gasta desde un maximo derivado de VOL. */
  const claRS=(DATOS?dGet("clases",ch.clase):null)?.recursoSecundario||null;
  const recSecMax=!claRS?0:(claRS.max!=null?claRS.max:(claRS.maxBase||0)+rd((a[claRS.maxAtributo]||0)/(claRS.maxDivisor||1)));
  const recSecAct=Math.min(recSecMax,parseInt(ch.stats.recSecActual)||0);
  const iniBase=a.AGI||0,ini=iniBase+(parseInt(m.iniMod)||0);
  const tenso=rd((a.VOL||0)/10),estresado=rd((a.VOL||0)/5);
  const paTot=ATTRIBUTES.reduce((s,at)=>s+(ab[at.key]||0),0);
  const bCMBase=rd((a.AGI||0)/10),bCM=bCMBase+(parseInt(m.bCMMod)||0);
  const bCDBase=rd((a.AGI||0)/5),bCD=bCDBase+(parseInt(m.bCDMod)||0);
  const pCritBase=rd((a.AGI||0)/10)+5,pCrit=pCritBase+(parseInt(m.pCritMod)||0);
  const dCritBase=rd((a.AGI||0)/5),dCrit=dCritBase+(parseInt(m.dCritMod)||0);
  const shieldBonus=ch.escudo==="Ligero"?5:ch.escudo==="Pesado"?10:0;
  const aLig=rd((a.CM||0)/10)+rd((a.AGI||0)/5)+shieldBonus+(parseInt(m.aLigMod)||0);
  const aMed=rd((a.CM||0)/10)+rd((a.AGI||0)/10)+shieldBonus+(parseInt(m.aMedMod)||0);
  const aPes=rd((a.CM||0)/10)+shieldBonus+(parseInt(m.aPesMod)||0);
  const pvR=pv-(parseInt(ch.stats.pvGast)||0),amR=afMag-(parseInt(ch.stats.amGast)||0),paR=paMax-(parseInt(ch.stats.paGast)||0),recR=rec-(parseInt(ch.stats.recursoGast)||0);
  const pnTN=parseInt(ch.pnTotales)||0,pnX=parseInt(ch.pnExtras)||0,pnU=(ch.tecnicas||[]).reduce((s,t)=>s+(parseInt(t.pn)||0),0);
  // Pasivas: 50 - ATTR + competencia + mod
  const percComp=getSkillVal(ch,"Percepción"),invComp=getSkillVal(ch,"Investigación"),perspComp=getSkillVal(ch,"Perspicacia");
  const percPas=50-(a.INT||0)+percComp+(parseInt(m.percPasMod)||0);
  const invPas=50-(a.INT||0)+invComp+(parseInt(m.invPasMod)||0);
  const perspPas=50-(a.VOL||0)+perspComp+(parseInt(m.perspPasMod)||0);
  return{pv,pvBase,afMag,afMagBase,paMax,rec,ini,iniBase,tenso,estresado,paTot,claRS,recSecMax,recSecAct,bCM,bCD,pCrit,pCritBase,dCrit,dCritBase,aLig,aMed,aPes,pvR,amR,paR,recR,pnTN,pnX,pnU,pnElegidas:(function(){if(!DATOS)return 0;
    return (ch.elegidas||[]).reduce((s,id)=>{const [t,n]=id.split("|");
      const e=DATOS.entradas.find(x=>x.tipo===t&&x.nombre===n);return s+(e?pnDe(ch,e):0)},0)})(),
  pnR:pnTN+pnX-pnU-(function(){if(!DATOS)return 0;
    return (ch.elegidas||[]).reduce((s,id)=>{const [t,n]=id.split("|");
      const e=DATOS.entradas.find(x=>x.tipo===t&&x.nombre===n);return s+(e?pnDe(ch,e):0)},0)})(),shieldBonus,percPas,invPas,perspPas};
}

  if(verTodo[tipo==="tecnica"?"tec":"hec"])return todo;
